name: swiftdrop-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    restart: unless-stopped
    env_file:
      - path: ./infrastructure/dev/.env
        required: false
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password123}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - swiftdrop_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  swiftdrop_rabbitmq_data:
    name: swiftdrop-rabbitmq-data
