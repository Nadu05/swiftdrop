# ============================================================
# SwiftDrop - Docker Compose Configuration
# ============================================================
# 8 containers: 1 RabbitMQ, 5 microservices, 1 API gateway, 1 frontend
# Databases are hosted on Neon PostgreSQL Cloud
#
# DB wiring: Spring Boot reads SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# from the environment and they override spring.datasource.* in application.yml.
# Flyway uses FLYWAY_DB_URL (direct, non-pooled Neon host) as in application.yml.
# ============================================================

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-swiftdrop}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

x-service-base: &service-base
  networks:
    - swiftdrop-network
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy

services:

  # ==================== MESSAGE BROKER ====================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - swiftdrop-network
    restart: unless-stopped

  # ==================== MICROSERVICES ====================

  identity-service:
    <<: *service-base
    build:
      context: ../../services/identity-service
      dockerfile: Dockerfile
    container_name: swiftdrop-identity-service
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST:?Set NEON_HOST in .env}:${NEON_PORT:-5432}/${IDENTITY_DB_NAME:-swiftdrop_identity}${NEON_SSL_MODE:-?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:?Set NEON_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?Set NEON_PASSWORD in .env}
      FLYWAY_DB_URL: jdbc:postgresql://${NEON_DIRECT_HOST:-${NEON_HOST}}:${NEON_PORT:-5432}/${IDENTITY_DB_NAME:-swiftdrop_identity}${NEON_SSL_MODE:-?sslmode=require}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  organization-service:
    <<: *service-base
    build:
      context: ../../services/organization-service
      dockerfile: Dockerfile
    container_name: swiftdrop-organization-service
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST:?Set NEON_HOST in .env}:${NEON_PORT:-5432}/${ORGANIZATION_DB_NAME:-swiftdrop_organization}${NEON_SSL_MODE:-?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:?Set NEON_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?Set NEON_PASSWORD in .env}
      FLYWAY_DB_URL: jdbc:postgresql://${NEON_DIRECT_HOST:-${NEON_HOST}}:${NEON_PORT:-5432}/${ORGANIZATION_DB_NAME:-swiftdrop_organization}${NEON_SSL_MODE:-?sslmode=require}
    ports:
      - "${ORGANIZATION_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  order-service:
    <<: *service-base
    build:
      context: ../../services/order-service
      dockerfile: Dockerfile
    container_name: swiftdrop-order-service
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST:?Set NEON_HOST in .env}:${NEON_PORT:-5432}/${ORDER_DB_NAME:-swiftdrop_order}${NEON_SSL_MODE:-?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:?Set NEON_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?Set NEON_PASSWORD in .env}
      FLYWAY_DB_URL: jdbc:postgresql://${NEON_DIRECT_HOST:-${NEON_HOST}}:${NEON_PORT:-5432}/${ORDER_DB_NAME:-swiftdrop_order}${NEON_SSL_MODE:-?sslmode=require}
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  dispatch-service:
    <<: *service-base
    build:
      context: ../../services/dispatch-service
      dockerfile: Dockerfile
    container_name: swiftdrop-dispatch-service
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST:?Set NEON_HOST in .env}:${NEON_PORT:-5432}/${DISPATCH_DB_NAME:-swiftdrop_dispatch}${NEON_SSL_MODE:-?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:?Set NEON_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?Set NEON_PASSWORD in .env}
      FLYWAY_DB_URL: jdbc:postgresql://${NEON_DIRECT_HOST:-${NEON_HOST}}:${NEON_PORT:-5432}/${DISPATCH_DB_NAME:-swiftdrop_dispatch}${NEON_SSL_MODE:-?sslmode=require}
    ports:
      - "${DISPATCH_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  notification-service:
    <<: *service-base
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: swiftdrop-notification-service
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST:?Set NEON_HOST in .env}:${NEON_PORT:-5432}/${NOTIFICATION_DB_NAME:-swiftdrop_notification}${NEON_SSL_MODE:-?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:?Set NEON_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?Set NEON_PASSWORD in .env}
      FLYWAY_DB_URL: jdbc:postgresql://${NEON_DIRECT_HOST:-${NEON_HOST}}:${NEON_PORT:-5432}/${NOTIFICATION_DB_NAME:-swiftdrop_notification}${NEON_SSL_MODE:-?sslmode=require}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ==================== API GATEWAY ====================

  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: swiftdrop-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      DISPATCH_SERVICE_URL: http://dispatch-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - swiftdrop-network
    restart: unless-stopped

  # ==================== FRONTEND ====================

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: swiftdrop-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - swiftdrop-network
    restart: unless-stopped


# ==================== VOLUMES ====================

volumes:
  rabbitmq-data:
    name: swiftdrop-rabbitmq-data

# ==================== NETWORKS ====================

networks:
  swiftdrop-network:
    name: swiftdrop-network
    driver: bridge