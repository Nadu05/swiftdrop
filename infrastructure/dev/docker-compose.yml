# SwiftDrop – Development Docker Compose

name: swiftdrop-dev

# Shared RabbitMQ configuration
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: swiftdrop-rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-swiftdrop}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

# Shared configuration for application services
x-service-base: &service-base
  restart: unless-stopped
  networks:
    - swiftdrop-network

services:

  # =========================
  # IDENTITY SERVICE
  # =========================
  identity-service:
    <<: *service-base
    container_name: swiftdrop-identity-service
    build:
      context: ../../services/identity-service
      dockerfile: Dockerfile
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://swiftdrop-postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      FLYWAY_DB_URL: jdbc:postgresql://swiftdrop-postgres:5432/identity_db
      FLYWAY_DB_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
    ports:
      - "8081:8081"

  # =========================
  # ORGANIZATION SERVICE
  # =========================
  organization-service:
    <<: *service-base
    container_name: swiftdrop-organization-service
    build:
      context: ../../services/organization-service
      dockerfile: Dockerfile
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://swiftdrop-postgres:5432/organization_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      FLYWAY_DB_URL: jdbc:postgresql://swiftdrop-postgres:5432/organization_db
      FLYWAY_DB_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
    ports:
      - "8082:8082"

  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    <<: *service-base
    container_name: swiftdrop-order-service
    build:
      context: ../../services/order-service
      dockerfile: Dockerfile
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://swiftdrop-postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      FLYWAY_DB_URL: jdbc:postgresql://swiftdrop-postgres:5432/order_db
      FLYWAY_DB_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      SWIFTDROP_AI_ENABLED: ${SWIFTDROP_AI_ENABLED:-true}
      SWIFTDROP_AI_PROVIDER: ${SWIFTDROP_AI_PROVIDER:-gemini}
      SWIFTDROP_AI_MODEL: ${SWIFTDROP_AI_MODEL:-gemini-3.5-flash-lite}
      SWIFTDROP_AI_API_KEY: ${SWIFTDROP_AI_API_KEY:-}
      SWIFTDROP_AI_BASE_URL: ${SWIFTDROP_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      SWIFTDROP_AI_CONNECT_TIMEOUT_MS: ${SWIFTDROP_AI_CONNECT_TIMEOUT_MS:-10000}
      SWIFTDROP_AI_READ_TIMEOUT_MS: ${SWIFTDROP_AI_READ_TIMEOUT_MS:-30000}
      SWIFTDROP_AI_MAX_MESSAGE_LENGTH: ${SWIFTDROP_AI_MAX_MESSAGE_LENGTH:-1000}
      SWIFTDROP_AI_MAX_HISTORY_MESSAGES: ${SWIFTDROP_AI_MAX_HISTORY_MESSAGES:-10}
      SWIFTDROP_AI_RATE_LIMIT_MAX_REQUESTS: ${SWIFTDROP_AI_RATE_LIMIT_MAX_REQUESTS:-15}
      SWIFTDROP_AI_RATE_LIMIT_WINDOW_SECONDS: ${SWIFTDROP_AI_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8083:8083"

  # =========================
  # DISPATCH SERVICE
  # =========================
  dispatch-service:
    <<: *service-base
    container_name: swiftdrop-dispatch-service
    build:
      context: ../../services/dispatch-service
      dockerfile: Dockerfile
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://swiftdrop-postgres:5432/dispatch_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      FLYWAY_DB_URL: jdbc:postgresql://swiftdrop-postgres:5432/dispatch_db
      FLYWAY_DB_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
    ports:
      - "8084:8084"

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    <<: *service-base
    container_name: swiftdrop-notification-service
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    environment:
      <<: *rabbitmq-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://swiftdrop-postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}
      FLYWAY_DB_URL: jdbc:postgresql://swiftdrop-postgres:5432/notification_db
      FLYWAY_DB_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_PASSWORD in .env}}}

      # Mailpit
      SPRING_MAIL_HOST: swiftdrop-mailpit
      SPRING_MAIL_PORT: 1025

    ports:
      - "8085:8085"

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    restart: unless-stopped
    container_name: swiftdrop-api-gateway
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

      IDENTITY_SERVICE_URL: http://swiftdrop-identity-service:8081
      ORGANIZATION_SERVICE_URL: http://swiftdrop-organization-service:8082
      ORDER_SERVICE_URL: http://swiftdrop-order-service:8083
      DISPATCH_SERVICE_URL: http://swiftdrop-dispatch-service:8084
      NOTIFICATION_SERVICE_URL: http://swiftdrop-notification-service:8085

    depends_on:
      - identity-service
      - organization-service
      - order-service
      - dispatch-service
      - notification-service

    networks:
      - swiftdrop-network

    ports:
      - "8080:8080"

# =========================
# NETWORK
# =========================
networks:
  swiftdrop-network:
    external: true
    name: swiftdrop-local-network
