# =============================================================================
# SwiftDrop Notification Service — Local Developer Configuration
# Ready-to-use configuration with hardcoded local PostgreSQL & RabbitMQ
# No environment variables required.
# =============================================================================

server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/swiftdrop_notification
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/swiftdrop_notification
    user: postgres
    password: postgrespassword
  rabbitmq:
    host: localhost
    port: 5672
    username: swiftdrop
    password: password123
    connection-timeout: 10000
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId:-none}] - %msg%n"
  level:
    com.swiftdrop.notification: DEBUG
    org.springframework.web: INFO

app:
  jwt:
    secret: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=
  mail:
    enabled: ${SPRING_MAIL_ENABLED:true}
    from: ${SPRING_MAIL_FROM:noreply@swiftdrop.lk}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://localhost:3000}}
