server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: dispatch-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${NEON_HOST:localhost}:5432/${DISPATCH_DB_NAME:swiftdrop_dispatch}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${NEON_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${NEON_PASSWORD:admin@1234}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 10000

services:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    verify-on-assignment: ${ORDER_VERIFY_ON_ASSIGNMENT:false}
    ready-for-dispatch-path: ${ORDER_SERVICE_READY_PATH:/api/v1/orders/ready-for-dispatch}
    connect-timeout: 3000
    read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.swiftdrop.dispatch: DEBUG
    org.springframework.web: INFO
