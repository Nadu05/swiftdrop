server:
  port: ${SERVER_PORT:8084}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: dispatch-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:src/.env[.properties]
      - optional:file:../../infrastructure/dev/.env[.properties]
      - optional:file:infrastructure/dev/.env[.properties]
  datasource:
    url: jdbc:postgresql://${NEON_HOST}/${DISPATCH_DB_NAME:swiftdrop_dispatch}?sslmode=${NEON_SSLMODE:require}
    username: ${NEON_USER}
    password: ${NEON_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:password}
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId:-none}] - %msg%n"
  level:
    com.swiftdrop.dispatch: DEBUG
    org.springframework.web: INFO

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=}

swiftdrop:
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  organization-service:
    base-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
  pod-storage:
    base-dir: ${POD_STORAGE_DIR:./data/pod-evidence}
    max-delivery-attempts: 3

