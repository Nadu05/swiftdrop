spring:
  datasource:
    url: jdbc:h2:mem:dispatch_concurrency_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
    listener:
      simple:
        auto-startup: false

services:
  order:
    base-url: http://localhost:8083
    verify-on-assignment: false
