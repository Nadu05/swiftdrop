server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${NEON_HOST}:5432/swiftdrop_order?sslmode=require
    username: ${NEON_USER}
    password: ${NEON_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:password}
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId:-none}] - %msg%n"
  level:
    com.swiftdrop.order: DEBUG
    org.springframework.web: INFO

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=}

swiftdrop:
  organization-service:
    base-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
  pricing:
    # PROVISIONAL INITIAL RATES (Configurable per BD-06 / UD-10)
    provisional: true
    currency: ${PRICING_CURRENCY:LKR}
    base-fee: ${PRICING_BASE_FEE:450.00}
    per-km-rate: ${PRICING_PER_KM_RATE:65.00}
    included-weight-kg: ${PRICING_INCLUDED_WEIGHT_KG:1.00}
    per-kg-rate: ${PRICING_PER_KG_RATE:120.00}
    quote-validity-minutes: ${PRICING_QUOTE_VALIDITY_MINUTES:30}
    size-surcharges:
      SMALL: ${PRICING_SURCHARGE_SMALL:0.00}
      MEDIUM: ${PRICING_SURCHARGE_MEDIUM:250.00}
      LARGE: ${PRICING_SURCHARGE_LARGE:650.00}
      EXTRA_LARGE: ${PRICING_SURCHARGE_EXTRA_LARGE:1200.00}

