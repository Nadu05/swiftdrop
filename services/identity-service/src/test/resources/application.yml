spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctaG1hYy1zaGEtMjU2LXN3aWZ0ZHJvcC1hdXRoLTIwMjY=
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  google:
    client-id: test-google-client-id.apps.googleusercontent.com
  cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origins: http://localhost:3000

