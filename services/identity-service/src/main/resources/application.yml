server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${NEON_HOST:ep-cool-cloud-b57tg7xe.c-7.us-east-2.aws.neon.tech}:${NEON_PORT:5432}/${IDENTITY_DB_NAME:swiftdrop_identity}?sslmode=${SSL_MODE:require}}
    username: ${SPRING_DATASOURCE_USERNAME:${NEON_USER:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${NEON_PASSWORD:npg_JK9N8kxwmfFu}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:password}
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.swiftdrop.identity: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

# ============================================================
# SwiftDrop Identity Service — Application Properties
# ============================================================
app:
  jwt:
    # Base64-encoded HMAC-SHA256 secret — MUST be set via environment variable in production
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}      # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}  # 7 days

  google:
    client-id: ${GOOGLE_CLIENT_ID:886734300259-8d1q7uus60cf1abicqgeji3nngudhqhk.apps.googleusercontent.com}

  cookie:
    secure: ${COOKIE_SECURE:false}       # true in production (HTTPS)
    same-site: ${COOKIE_SAME_SITE:Lax}   # Lax for dev, None for cross-origin prod

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}