server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../infrastructure/dev/.env[.properties]
      - optional:file:infrastructure/dev/.env[.properties]
  datasource:
    url: jdbc:postgresql://${NEON_HOST}/${IDENTITY_DB_NAME:${NEON_DB:swiftdrop_identity}}?sslmode=${NEON_SSLMODE:require}
    username: ${NEON_USER:postgres}
    password: ${NEON_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:swiftdrop}}
    password: ${RABBITMQ_PASSWORD:password123}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.swiftdrop: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ---------------------------------------------------------------------------
# Application-specific configuration (all secrets via environment variables)
# ---------------------------------------------------------------------------
app:
  jwt:
    # Must be a Base64-encoded 256-bit (32+ byte) secret in production
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000} # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  google:
    # Set GOOGLE_CLIENT_ID in environment to enable Google OAuth login (defaults to demo-client-id for local dev)
    client-id: ${GOOGLE_CLIENT_ID:demo-client-id}
  cookie:
    # Set COOKIE_SECURE=true in production (HTTPS required)
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
