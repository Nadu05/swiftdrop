server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: organization-service
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${NEON_HOST:localhost}:${NEON_PORT:5437}/${ORGANIZATION_DB_NAME:organization_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${NEON_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${NEON_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:password}
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.swiftdrop.organization: DEBUG
    org.springframework.web: INFO

organization:
  service-area:
    default-radius-km: ${DEFAULT_SERVICE_AREA_RADIUS_KM:25.00}
