# =============================================================================
# SwiftDrop Organization Service — Local Developer Configuration
# Ready-to-use configuration with hardcoded local PostgreSQL & RabbitMQ
# No environment variables required.
# =============================================================================

server:
  port: 8082

spring:
  application:
    name: organization-service
  datasource:
    url: jdbc:postgresql://localhost:5433/swiftdrop_organization
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}
    baseline-on-migrate: true
    validate-on-migrate: false
    url: jdbc:postgresql://localhost:5433/swiftdrop_organization
    user: postgres
    password: postgrespassword
  rabbitmq:
    host: localhost
    port: 5672
    username: swiftdrop
    password: password123
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId:-none}] - %msg%n"
  level:
    com.swiftdrop.organization: DEBUG
    org.springframework.web: INFO

app:
  jwt:
    secret: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hLXN0cm9uZy1zZWNyZXQtaGVyZS0xMjM0NTY3ODk=

swiftdrop:
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
