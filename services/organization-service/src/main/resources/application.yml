server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: organization-service
  datasource:
    url: jdbc:postgresql://${NEON_HOST}:5432/swiftdrop_organization?sslmode=require
    username: ${NEON_USER}
    password: ${NEON_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:password}
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.swiftdrop.organization: DEBUG
    org.springframework.web: INFO
